api:
  base_url: "https://api.restajet.com/admin_v1"
  page_size: 10
  request_timeout: 10

database:
  server: "192.168.5.211\\SQLEXPRESS"
  database: "RestaOrders"
  username: "sa"
  driver: "ODBC Driver 18 for SQL Server"

logging:
  filename: "order_sync.log"
  level: "ERROR"
  max_bytes: 10485760  # 10MB
  backup_count: 3

sync:
  polling_interval: 30  # 5 minutes
  request_delay: 0.5
  max_retries: 3
  delay_between_orders: 0.5
  delay_between_pages: 0.5
  delay_on_error: 5.0
  skip_duplicate_checks: false  # Set to true to disable primary duplicate checks

schedule:
  # Run from 9:00 AM to 5:00 PM on weekdays
  start_hour: 22
  start_minute: 0
  end_hour: 18
  end_minute: 0
  active_days:
    - MONDAY
    - TUESDAY
    - WEDNESDAY
    - THURSDAY
    - FRIDAY
    - SATURDAY
    - SUNDAY
